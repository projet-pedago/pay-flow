name: payrollflow

x-backend: &backend
  image: payrollflow-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - payroll-data:/app/data
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-azure: &azure
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-61a719fe-4a65-43a0-aeaf-4f21dedfdc41}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-c8bb705c-2d97-4d0b-b692-37cc14ae4d29}
  AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-379ae343-3396-403c-b23e-87d7d10a47ca}

services:
  auth:
    <<: *backend
    container_name: payrollflow-auth
    environment:
      <<: *azure
      PORT: "45231"
      START: src/services/auth/index.ts
      JWT_SECRET: ${JWT_SECRET:-payrollflow-dev-secret}
      DATA_DIR: /app/data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    expose:
      - "45231"

  hr:
    <<: *backend
    container_name: payrollflow-hr
    environment:
      <<: *azure
      PORT: "45232"
      START: src/services/hr/index.ts
      JWT_SECRET: ${JWT_SECRET:-payrollflow-dev-secret}
      DATA_DIR: /app/data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      AZURE_GRAPH_CLIENT_ID: ${AZURE_GRAPH_CLIENT_ID:-}
      AZURE_GRAPH_CLIENT_SECRET: ${AZURE_GRAPH_CLIENT_SECRET:-}
      AZURE_PAYFLOW_ROLE_ADMIN_ID: ${AZURE_PAYFLOW_ROLE_ADMIN_ID:-68b0c89b-e615-470a-8a92-50f57b07a4be}
      AZURE_PAYFLOW_ROLE_HR_ID: ${AZURE_PAYFLOW_ROLE_HR_ID:-13f289a4-a8c1-41ad-afe5-64040b587b26}
      AZURE_PAYFLOW_ROLE_EMPLOYEE_ID: ${AZURE_PAYFLOW_ROLE_EMPLOYEE_ID:-394165ce-9655-44b9-aca2-12b406dcc69a}
    expose:
      - "45232"

  payroll:
    <<: *backend
    container_name: payrollflow-payroll
    environment:
      PORT: "45233"
      START: src/services/payroll/index.ts
      JWT_SECRET: ${JWT_SECRET:-payrollflow-dev-secret}
      DATA_DIR: /app/data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    expose:
      - "45233"

  time:
    <<: *backend
    container_name: payrollflow-time
    environment:
      PORT: "45234"
      START: src/services/time/index.ts
      JWT_SECRET: ${JWT_SECRET:-payrollflow-dev-secret}
      DATA_DIR: /app/data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    expose:
      - "45234"

  gateway:
    <<: *backend
    container_name: payrollflow-gateway
    environment:
      PORT: "45218"
      START: src/gateway/index.ts
      AUTH_URL: http://auth:45231
      HR_URL: http://hr:45232
      PAYROLL_URL: http://payroll:45233
      TIME_URL: http://time:45234
    ports:
      - "45218:45218"
    depends_on:
      auth:
        condition: service_healthy
      hr:
        condition: service_healthy
      payroll:
        condition: service_healthy
      time:
        condition: service_healthy

  frontend:
    image: payrollflow-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-61a719fe-4a65-43a0-aeaf-4f21dedfdc41}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-c8bb705c-2d97-4d0b-b692-37cc14ae4d29}
        VITE_AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-379ae343-3396-403c-b23e-87d7d10a47ca}
    container_name: payrollflow-web
    restart: unless-stopped
    ports:
      - "45217:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  payroll-data:
