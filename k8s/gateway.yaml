apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: payrollflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: acrpayrollflowyao.azurecr.io/payrollflow/backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 45218
          env:
            - name: PORT
              value: "45218"
            - name: START
              value: "src/gateway/index.ts"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payrollflow-secrets
                  key: JWT_SECRET

            - name: AUTH_URL
              value: "http://auth:45231"

            - name: HR_URL
              value: "http://hr:45232"

            - name: PAYROLL_URL
              value: "http://payroll:45233"

            - name: TIME_URL
              value: "http://time:45234"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: payrollflow
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 45218
      targetPort: 45218
