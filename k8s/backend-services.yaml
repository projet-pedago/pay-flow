apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: payrollflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: acrpayrollflowyao.azurecr.io/payrollflow/backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 45231
          env:
            - name: PORT
              value: "45231"

            - name: START
              value: "src/services/auth/index.ts"

            - name: DATA_DIR
              value: "/app/data"

            - name: AZURE_CLIENT_ID
              value: "61a719fe-4a65-43a0-aeaf-4f21dedfdc41"

            - name: AZURE_TENANT_ID
              value: "c8bb705c-2d97-4d0b-b692-37cc14ae4d29"

            - name: AZURE_API_CLIENT_ID
              value: "379ae343-3396-403c-b23e-87d7d10a47ca"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payrollflow-secrets
                  key: JWT_SECRET

          volumeMounts:
            - name: payroll-data
              mountPath: /app/data

            # Azure Key Vault via Secrets Store CSI
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: payroll-data
          persistentVolumeClaim:
            claimName: payroll-data

        # Déclenche le montage des secrets depuis Azure Key Vault
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: payrollflow-keyvault

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: payrollflow
spec:
  selector:
    app: auth
  ports:
    - port: 45231
      targetPort: 45231

